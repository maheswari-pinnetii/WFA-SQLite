version: '3.8'

services:
  stackly-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: stackly_enterprise_platform
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_TYPE=sqlite
    volumes:
      - stackly_data:/app/database/sqlite
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  stackly_data:
    driver: local
